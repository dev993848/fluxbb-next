services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fluxbb-app
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      DB_DRIVER: pdo_pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: fluxbb
      DB_USER: fluxbb
      DB_PASSWORD: fluxbb_secret
      CACHE_DSN: redis://redis:6379/1
      CACHE_NAMESPACE: fluxbb_
      MAILER_DSN: smtp://mailhog:1025
      MAILER_FROM: noreply@fluxbb.local
      MAILER_FROM_NAME: "FluxBB Forum"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - fluxbb

  web:
    image: nginx:1.27-alpine
    container_name: fluxbb-web
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - fluxbb

  database:
    image: postgres:16-alpine
    container_name: fluxbb-db
    environment:
      POSTGRES_DB: fluxbb
      POSTGRES_USER: fluxbb
      POSTGRES_PASSWORD: fluxbb_secret
    volumes:
      - fluxbb_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxbb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fluxbb

  redis:
    image: redis:7-alpine
    container_name: fluxbb-redis
    volumes:
      - fluxbb_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fluxbb

  mailhog:
    image: mailhog/mailhog:latest
    container_name: fluxbb-mailhog
    ports:
      - "8025:8025"   # Web UI for viewing emails
      - "1025:1025"   # SMTP port
    networks:
      - fluxbb

volumes:
  fluxbb_db_data:
  fluxbb_redis_data:

networks:
  fluxbb: