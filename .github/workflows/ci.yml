name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, intl, pdo_pgsql, zip
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP CS Fixer (Dry Run)
        run: composer cs

      - name: PHPStan (mandatory – fail on error)
        run: composer phpstan

      - name: Psalm (mandatory – fail on error)
        run: composer psalm

      - name: Rector (Dry Run)
        run: composer rector

  tests:
    runs-on: ubuntu-latest
    needs: static-analysis
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fluxbb_test
          POSTGRES_USER: fluxbb
          POSTGRES_PASSWORD: fluxbb_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fluxbb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, intl, pdo_pgsql, zip
          tools: composer:v2
          coverage: xdebug

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: composer test
        env:
          DB_DRIVER: pdo_pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: fluxbb_test
          DB_USER: fluxbb
          DB_PASSWORD: fluxbb_secret